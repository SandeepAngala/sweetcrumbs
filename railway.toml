[build]
builder = "nixpacks"
buildCommand = "composer install --no-dev --optimize-autoloader --ignore-platform-reqs && npm ci && npm run build && rm -f public/hot"

[deploy]
startCommand = "sh scripts/railway-start.sh"
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
